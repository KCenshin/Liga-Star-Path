# Blueprint de Render: https://render.com/docs/blueprint-spec
# Un Disk persistente requiere un plan de pago (Starter). El plan Free tiene disco efímero:
# perderías la BD SQLite y los avatares en cada despliegue/reinicio.
services:
  - type: web
    name: liga-star-path
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: liga-data
      mountPath: /var/data
      sizeGB: 1
