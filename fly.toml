# Cambia "app" por un nombre único (o déjalo y usa `fly launch --no-deploy --copy-config`).
app = "liga-star-path"
primary_region = "qro"   # Querétaro; alternativas: dfw, mia, iad

[build]

[env]
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"

[mounts]
  source = "liga_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpus = 1
