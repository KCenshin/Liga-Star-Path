{% extends "base.html" %}
{% block title %}Entrar · Liga Star Path{% endblock %}
{% block content %}
<div class="card form-card narrow">
  <h1>Entrar</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Usuario o correo</span><input name="username" required autofocus></label>
    <label class="field"><span>Contraseña</span><input type="password" name="password" required></label>
    <label class="check"><input type="checkbox" name="remember"> Recordarme</label>
    <button class="btn btn-primary btn-block">Entrar</button>
  </form>
  <p class="muted small">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
</div>
{% endblock %}
