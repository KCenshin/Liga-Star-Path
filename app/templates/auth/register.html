{% extends "base.html" %}
{% block title %}Registro · Liga Star Path{% endblock %}
{% block content %}
<div class="card form-card narrow">
  <h1>Crear cuenta de entrenador</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Nombre de usuario</span>
      <input name="username" value="{{ username or '' }}" required pattern="[A-Za-z0-9_]{3,32}" maxlength="32"></label>
    <label class="field"><span>Correo</span><input type="email" name="email" value="{{ email or '' }}" required></label>
    <label class="field"><span>Contraseña (mín. 8)</span><input type="password" name="password" minlength="8" required></label>
    <button class="btn btn-primary btn-block">Registrarme</button>
  </form>
  <p class="muted small">Todos los nuevos usuarios comienzan como <strong>Retador</strong>.</p>
</div>
{% endblock %}
